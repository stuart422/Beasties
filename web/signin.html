<!doctype html>
<html lang="en" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#113C2B">
<title>Sign in · Beasties</title>
<!-- The cover of the memory book. Per the handoff, the sign-in page shows no private group photos:
     the prints behind the card are abstract light only. -->
<script>
  (function () {
    var d = document.documentElement, saved = null;
    try { saved = localStorage.getItem('beasties-motion'); } catch (e) {}
    var reduce = saved ? saved === 'reduced' : matchMedia('(prefers-reduced-motion: reduce)').matches;
    d.dataset.motion = reduce ? 'reduced' : 'full';
    d.classList.add('is-loading');
  })();
</script>
<script type="module" src="/src/signin.js"></script>
</head>
<body class="cover-page">

<main id="main" class="cover">
  <div class="cover__light" aria-hidden="true"></div>
  <p class="cover__emboss" aria-hidden="true">Beasties</p>

  <header class="cover__top">
    <p class="cover__brand">Beasties</p>
    <p class="cover__tag"><span class="cover__dot" aria-hidden="true"></span>Private · Members only</p>
  </header>

  <section class="cover__words" aria-labelledby="coverTitle">
    <h1 class="cover__title" id="coverTitle">
      <span class="cover__mask"><span class="cover__line">A Family</span></span>
      <span class="cover__mask"><span class="cover__line">of <em>Friends</em></span></span>
    </h1>
    <p class="cover__lead">Our photos, our plans and the weekends we share, kept in one private place.</p>
  </section>

  <div class="stack" id="stack">
    <div class="stack__print stack__print--back" aria-hidden="true"><span class="stack__light stack__light--dusk"></span></div>
    <div class="stack__print stack__print--mid" aria-hidden="true"><span class="stack__light stack__light--dawn"></span></div>

    <div class="card" id="card">
      <div class="card__head">
        <p class="card__eyebrow">Welcome back</p>
        <h2 class="card__title">Sign in</h2>
        <p class="card__note">Use the email and password you were given.</p>
      </div>
      <form class="card__form" id="form" novalidate>
        <div class="cfield">
          <label class="cfield__label" for="email">Email</label>
          <input class="cfield__input" id="email" type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="cfield">
          <label class="cfield__label" for="password">Password</label>
          <div class="cfield__wrap">
            <input class="cfield__input cfield__input--pw" id="password" type="password" name="password" autocomplete="current-password" required aria-describedby="caps">
            <button class="cfield__show" type="button" id="showPw" aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <p class="cfield__hint" id="caps" hidden>Caps Lock is on.</p>
        </div>
        <p class="card__error" id="error" role="alert" hidden></p>
        <button class="card__submit" type="submit" id="submit">
          <span class="card__submit-text">Sign in</span>
          <span class="card__arrow" aria-hidden="true"></span>
        </button>
      </form>
      <p class="card__help">Trouble signing in? Contact the person who gave you your login.</p>
    </div>
  </div>
</main>

</body>
</html>
