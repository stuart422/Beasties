<!doctype html>
<html lang="en" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FBF6EC">
<title>My profile · Beasties</title>
<script>
  (function () {
    var d = document.documentElement, saved = null;
    try { saved = localStorage.getItem('beasties-motion'); } catch (e) {}
    var reduce = saved ? saved === 'reduced' : matchMedia('(prefers-reduced-motion: reduce)').matches;
    d.dataset.motion = reduce ? 'reduced' : 'full';
  })();
</script>
<script type="module" src="/src/profile.js"></script>
</head>
<body>

<div id="chrome"></div>

<main id="main">
  <section class="album-head">
    <div class="wrap album-head__in">
      <h1 class="album-title">My profile</h1>
      <p class="album-meta" id="intro"></p>
    </div>
  </section>
  <div class="wrap account" id="content"></div>
</main>

<div id="foot"></div>

</body>
</html>
